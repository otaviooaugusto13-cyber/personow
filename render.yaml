# Blueprint do Render: cria o servidor do Personow (API + site) como Web Service.
# (Static Site NÃO serve: ele não roda Node e devolve "Not Found" nas rotas da API.)
services:
  - type: web
    name: personow
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /saude
    envVars:
      - key: AMBIENTE
        value: producao              # liga as travas de produção: o servidor não sobe sem as variáveis abaixo
      - key: APP_URL
        sync: false                  # https://SEU-APP.onrender.com (ou seu domínio), sem barra final
      - key: ORIGENS_PERMITIDAS
        sync: false                  # opcional: outros domínios do front (separados por vírgula)
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: MP_CLIENT_ID
        sync: false
      - key: MP_CLIENT_SECRET
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: DATA_ENCRYPTION_KEYS    # npm run gerar-chaves (guarde BACKUP: perder a chave = perder CPF/Pix cifrados)
        sync: false
      - key: DATA_ENCRYPTION_KEY_ID
        sync: false
      - key: BLIND_INDEX_KEY
        sync: false
      - key: ADMIN_EXIGE_MFA         # exige 2ª etapa do Google para o painel admin (ative MFA no Firebase Auth antes)
        value: "0"
